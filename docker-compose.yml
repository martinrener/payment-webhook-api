services:
  mySQL:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: payment_webhook
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laravel", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      mySQL:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - .env.docker

  worker:
    build: .
    depends_on:
      mySQL:
        condition: service_healthy
      app:
        condition: service_started
    command: php artisan queue:work
    env_file:
      - .env.docker

  reverb:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mySQL:
        condition: service_healthy
      app:
        condition: service_started
    command: php artisan reverb:start --host=0.0.0.0
    env_file:
      - .env.docker